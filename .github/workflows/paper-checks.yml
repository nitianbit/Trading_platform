name: Paper app checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dhkpaper
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: dhkpaper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dhkpaper"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://dhkpaper:isolated-ci-only@127.0.0.1:5432/dhkpaper
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET_KEY: isolated-ci-session-signing-value-32chars
      ENCRYPTION_PEPPER: isolated-ci-encryption-value-32chars
      LOG_TO_FILE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.12.13
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: .venv/bin/python scripts/test_isolated.py --browser
      - name: Build source-stamped production images
        run: .venv/bin/python scripts/build_images.py
      - name: Verify operator migration, backup restoration and HTTPS/WSS
        run: .venv/bin/python scripts/check_deployment.py
